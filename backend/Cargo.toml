[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "My portfolio website (backend)"
repository = "https://github.com/ashereshteh/portfolio/backend"
readme = "README.md"

[dependencies]
actix-web = "4"
dotenvy = "0.15.7"
env_logger = "0.11.11"
log = "0.4.35"
thiserror = "2.0.21"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }
